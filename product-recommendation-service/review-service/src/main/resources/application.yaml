spring:
  application:
    name: review-service

  datasource:
    url: jdbc:mysql://localhost:3307/review_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 7003


logging:
  level:
    root: INFO