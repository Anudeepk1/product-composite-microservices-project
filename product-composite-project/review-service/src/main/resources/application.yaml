spring:
  application:
    name: review-service

server:
  port: 7003

app.eureka-server: localhost

spring.datasource:
    url: jdbc:mysql://localhost:3307/review_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

spring.jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

eureka:
  client:
    registerWithEureka: true  # Enable this service to register itself with the Eureka server
    fetchRegistry: true       # Enable this service to fetch the registry (list of other registered services)
    serviceUrl:
      defaultZone: http://${app.eureka-server}:8761/eureka/  # Eureka server URL (using a placeholder for host)
    initialInstanceInfoReplicationIntervalSeconds: 5  # Interval (in seconds) before the first heartbeat/registration
    registryFetchIntervalSeconds: 5  # How often (in seconds) to fetch the registry from Eureka server

  instance:
    leaseRenewalIntervalInSeconds: 5  # How often (in seconds) this service sends a heartbeat to Eureka
    leaseExpirationDurationInSeconds: 5  # Time (in seconds) after which Eureka removes the instance if no heartbeat is received


spring.cloud.function.definition: messageProcessor

spring.cloud.stream:
  defaultBinder: rabbit
  default.contentType: application/json
  bindings.messageProcessor-in-0:
    destination: reviews
    group: reviewsGroup

spring.cloud.stream.bindings.messageProcessor-in-0.consumer:
  maxAttempts: 3
  backOffInitialInterval: 500
  backOffMaxInterval: 1000
  backOffMultiplier: 2.0

spring.cloud.stream.rabbit.bindings.messageProcessor-in-0.consumer:
  autoBindDlq: true
  republishToDlq: true

spring.cloud.stream.kafka.bindings.messageProcessor-in-0.consumer:
  enableDlq: true
#
#spring.cloud.stream.kafka.binder:
#  brokers: 127.0.0.1
#  defaultBrokerPort: 9092

spring.rabbitmq:
  host: 127.0.0.1
  port: 5672
  username: guest
  password: guest

logging:
  level:
    root: INFO
    se.magnus: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management.endpoint.health.show-details: "ALWAYS"
management.endpoints.web.exposure.include: "*"

